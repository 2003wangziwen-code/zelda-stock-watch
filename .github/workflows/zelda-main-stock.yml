name: Zelda main-account restock watcher

on:
  push:
    branches: [main]
    paths:
      - 'zelda-stock-watch/**'
      - '.github/workflows/zelda-main-stock.yml'
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test stock detection without creating a notification Issue"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: zelda-main-account-watch
  cancel-in-progress: false

jobs:
  check:
    # Scheduled runs remain off until repository variable is explicitly enabled.
    if: \${{ github.event_name != 'schedule' || vars.ZELDA_STOCK_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright package (Chrome is preinstalled)
        run: python -m pip install "playwright>=1.50,<2"
      - name: Verify main/deputy isolation
        run: python -m unittest discover -s zelda-stock-watch -p "test_*.py"
      - name: Check main-account stock
        id: stock
        env:
          DRY_RUN: \${{ github.event_name == 'push' && '1' || (github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0') }}
        run: python zelda-stock-watch/watch.py
      - name: Create one GitHub Issue to trigger native notifications
        id: alert
        if: \${{ steps.stock.outputs.restocked == 'true' }}
        env:
          GH_TOKEN: \${{ github.token }}
          CHECKED_AT: \${{ steps.stock.outputs.checked_at }}
        shell: bash
        run: |
          set -euo pipefail
          title='【主号补货】塞尔达传说：时之笛'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
            --json title,url --jq '.[] | select(.title == "【主号补货】塞尔达传说：时之笛") | .url' | head -n 1)
          if [ -n "$existing" ]; then
            issue_url="$existing"
            echo "Existing alert Issue: $issue_url"
          else
            cat > restock_issue.md <<EOF
          @$GITHUB_REPOSITORY_OWNER

          GitHub Actions 已连续两次在游戏详情页识别到 **主号可租**。

          - 游戏：《塞尔达传说：时之笛 重制版》
          - 检查时间（北京时间）：$CHECKED_AT
          - **租赁页面：https://manygames.cn/games/library/cmw0iuzvc00gj01novq1f8s0d**
          - 仅监控主号；副号状态不能触发本通知

          库存可能随时变化，请以打开页面后的实际可租状态为准。
          EOF
            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file restock_issue.md \
              --assignee "$GITHUB_REPOSITORY_OWNER")
            echo "Created restock Issue: $issue_url"
          fi
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
      - name: Persist one-time notification record
        if: \${{ steps.alert.outputs.issue_url != '' }}
        env:
          ISSUE_URL: \${{ steps.alert.outputs.issue_url }}
          CHECKED_AT: \${{ steps.stock.outputs.checked_at }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("zelda-stock-watch/state.json")
          p.write_text(json.dumps({
              "notified": True, "checked_at": os.environ["CHECKED_AT"],
              "issue_url": os.environ["ISSUE_URL"],
              "url": "https://manygames.cn/games/library/cmw0iuzvc00gj01novq1f8s0d"
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zelda-stock-watch/state.json
          git commit -m "Record one-time Zelda main-account restock Issue"
          git push
      - name: Disable schedule after notifying
        if: \${{ steps.alert.outputs.issue_url != '' }}
        env:
          GH_TOKEN: \${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/zelda-main-stock.yml/disable"
